name: Build Geeklog 2.2.2 admin-only media preview

on:
  workflow_dispatch:
  push:
    branches:
      - native-media-library-pr
    paths:
      - 'public_html/filemanager/index.php'
      - 'public_html/filemanager/api.php'
      - 'public_html/filemanager/assets/media-library.js'
      - 'public_html/filemanager/assets/media-library.css'
      - 'system/classes/Media/**'
      - 'testing/native-media-library-2.2.2/**'
      - '.github/workflows/native-media-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          extensions: gd, fileinfo
          coverage: none
      - name: PHP 5.6 syntax check
        run: |
          php -v
          for f in public_html/filemanager/index.php public_html/filemanager/api.php system/classes/Media/*.php; do
            php -l "$f"
          done
      - name: PHP 5.6 runtime smoke test
        run: php testing/native-media-library-2.2.2/smoke.php
      - name: JavaScript syntax check
        run: node --check public_html/filemanager/assets/media-library.js
      - name: Build preview archive
        run: python3 testing/native-media-library-2.2.2/build-preview.py
      - name: Verify admin-only access is packaged
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'geeklog-2.2.2-native-media-library-preview-1.zip'
          with zipfile.ZipFile(name) as z:
              p = next(i for i in z.namelist() if i.endswith('/system/classes/Media/MediaLibrary.php'))
              s = z.read(p).decode('utf-8')
              assert 'Preview: administrators only' in s
              assert "SEC_hasRights('story.edit') || SEC_hasRights('story.submit')" not in s
              assert not any('/lib-common.php' in f for f in z.namelist())
          PY
      - name: Publish test ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geeklog-2.2.2-native-media-library-preview-1
          path: geeklog-2.2.2-native-media-library-preview-1.zip
          retention-days: 60
