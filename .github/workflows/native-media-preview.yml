name: Build Geeklog 2.2.2 admin-only media preview

on:
  workflow_dispatch:
  push:
    branches:
      - native-media-library-pr
    paths:
      - 'public_html/filemanager/index.php'
      - 'public_html/filemanager/api.php'
      - 'public_html/filemanager/assets/media-library.js'
      - 'public_html/filemanager/assets/media-library.css'
      - 'system/classes/Media/**'
      - 'testing/native-media-library-2.2.2/**'
      - '.github/workflows/native-media-preview.yml'

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up PHP 5.6
        uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          extensions: gd, fileinfo
          coverage: none
      - name: PHP 5.6 syntax check
        run: |
          php -v
          for f in public_html/filemanager/index.php public_html/filemanager/api.php system/classes/Media/*.php; do
            php -l "$f"
          done
      - name: PHP 5.6 runtime smoke test
        run: php testing/native-media-library-2.2.2/smoke.php
      - name: JavaScript syntax check
        run: node --check public_html/filemanager/assets/media-library.js
      - name: Build preview archive
        run: python3 testing/native-media-library-2.2.2/build-preview.py
      - name: Verify admin-only access is packaged
        run: |
          python3 - <<'PY'
          import zipfile
          name = 'geeklog-2.2.2-native-media-library-preview-1.zip'
          with zipfile.ZipFile(name) as z:
              p = next(i for i in z.namelist() if i.endswith('/system/classes/Media/MediaLibrary.php'))
              s = z.read(p).decode('utf-8')
              assert 'Preview: administrators only' in s
              assert "SEC_hasRights('story.edit') || SEC_hasRights('story.submit')" not in s
              assert not any('/lib-common.php' in f for f in z.namelist())
          PY
      - name: Verify recent live-site fixes are in the ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          archive = 'geeklog-2.2.2-native-media-library-preview-1.zip'
          with zipfile.ZipFile(archive) as z:
              js = z.read(next(n for n in z.namelist() if n.endswith('/assets/media-library.js'))).decode('utf-8')
              index = z.read(next(n for n in z.namelist() if n.endswith('/filemanager/index.php'))).decode('utf-8')
              assert 'maxActiveThumbnails = 2' in js, 'Thumbnail throttling missing'
              assert 'maxConcurrentUploads = 2' in js, 'Upload concurrency cap missing'
              assert "xhr.upload.addEventListener('progress'" in js, 'Per-file upload progress missing'
              assert "uploadDropzone.addEventListener('drop'" in js, 'Drag and drop missing'
              assert 'confirmDeleteFolder' in js, 'Folder deletion confirmation missing'
              assert 'confirmDeleteFolder' in index, 'Folder confirmation translation missing'
              assert 'type="file" multiple required' in index, 'Multiple file input missing'
              assert any(n.endswith('/README.md') for n in z.namelist())
              assert not any(n.endswith('/README_FR.md') for n in z.namelist())
              assert not any(n.endswith('/lib-common.php') for n in z.namelist())
          PY
      - name: Compute ZIP SHA-256
        run: sha256sum geeklog-2.2.2-native-media-library-preview-1.zip > geeklog-2.2.2-native-media-library-preview-1.zip.sha256
      - name: Publish ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geeklog-2.2.2-native-media-library-preview-1
          path: |
            geeklog-2.2.2-native-media-library-preview-1.zip
            geeklog-2.2.2-native-media-library-preview-1.zip.sha256
          retention-days: 60
      - name: Publish pinned community preview as GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/native-media-library-pr'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: native-media-library-2.2.2-preview.1
          ZIP: geeklog-2.2.2-native-media-library-preview-1.zip
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file testing/native-media-library-2.2.2/RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Geeklog 2.2.2 — Native Media Library Preview 1" \
              --notes-file testing/native-media-library-2.2.2/RELEASE_NOTES.md \
              --prerelease
          fi
